<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Brindilles — Bookings</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400;500;600&display=swap');

  :root {
    --cream: #f8f4ee;
    --warm:  #ede5d8;
    --ocean: #1e4a5c;
    --ocean-mid: #2d6678;
    --ocean-pale: #e8f0f3;
    --text:  #1a1a1a;
    --muted: #7a7060;
    --white: #fff;
    --border: #ddd5c4;
    --amber-bg: #faf0e0;
    --amber:    #8b6020;
    --pink-bg:  #fce4ec;
    --pink:     #c2185b;
    --green-bg: #e8f5e9;
    --green:    #2e7d32;
    --blue-bg:  #e3f2fd;
    --blue:     #1565c0;
    --grey-bg:  #f1f8e9;
    --grey-green: #558b2f;
    --grey-blue:  #1976d2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Jost', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; padding-bottom: 40px; }

  /* HEADER */
  header { background: var(--ocean); padding: 24px 20px 20px; }
  .prop-name { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 300; color: #fff; }
  .prop-sub  { font-size: 0.7rem; color: rgba(255,255,255,0.5); letter-spacing: 0.14em; text-transform: uppercase; margin-top: 4px; }
  .today-pill { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 5px 12px; font-size: 0.72rem; color: rgba(255,255,255,0.8); }
  .dot { width: 6px; height: 6px; background: #7ecba1; border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }

  /* FILTERS */
  .filters { display: flex; border-bottom: 2px solid var(--border); background: var(--cream); position: sticky; top: 0; z-index: 10; padding: 14px 20px 0; }
  .ftab { font-family: 'Jost', sans-serif; font-size: 0.75rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: transparent; border: none; padding: 6px 16px 12px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .ftab.on { color: var(--ocean); border-bottom-color: var(--ocean); }

  /* SECTION */
  .section-label { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 18px 20px 8px; }
  .cards { padding: 0 16px; }

  /* CARD */
  .card { background: var(--white); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; overflow: hidden; }
  .card.current  { border-color: var(--ocean-mid); box-shadow: 0 0 0 2px rgba(45,102,120,0.12); }
  .card.past     { opacity: 0.6; }
  .bar           { height: 3px; }
  .bar.current   { background: linear-gradient(90deg, var(--ocean), var(--ocean-mid)); }
  .bar.upcoming  { background: var(--amber); }
  .bar.past      { background: var(--border); }
  .card-body     { padding: 15px; }

  /* CARD TOP */
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 11px; }
  .gname { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 400; line-height: 1.1; }
  .sbadge { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border-radius: 10px; flex-shrink: 0; margin-top: 3px; }
  .sbadge.current  { background: var(--ocean-pale); color: var(--ocean); }
  .sbadge.upcoming { background: var(--amber-bg);   color: var(--amber); }
  .sbadge.past     { background: var(--warm);        color: var(--muted); }

  /* DATES */
  .dates  { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .dblock { flex: 1; background: var(--cream); border-radius: 7px; padding: 7px 9px; }
  .dlabel { font-size: 0.58rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .dval   { font-size: 0.9rem; font-weight: 500; }
  .nsep   { font-size: 0.68rem; color: var(--muted); text-align: center; flex-shrink: 0; }
  .nnum   { font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; display: block; color: var(--ocean); }

  /* CHIPS & TAGS */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 2px; }
  .chip  { display: flex; align-items: center; gap: 4px; background: var(--cream); border-radius: 20px; padding: 3px 9px; font-size: 0.76rem; }
  .tag   { display: inline-block; border-radius: 6px; padding: 4px 10px; font-size: 0.76rem; margin-top: 5px; font-weight: 500; }

  /* PROGRESS */
  .progress      { height: 3px; background: var(--warm); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--ocean), var(--ocean-mid)); border-radius: 2px; }
  .countdown     { font-size: 0.7rem; color: var(--ocean); font-weight: 500; margin-top: 4px; }

  .empty { text-align: center; padding: 36px; color: var(--muted); font-style: italic; font-size: 0.9rem; }
</style>
</head>

// ─── HELPERS ──────────────────────────────────────────────────────────────────
const today = new Date(); today.setHours(0,0,0,0);

function addDays(iso, n) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

function nights(ci, co) {
  return Math.round((new Date(co) - new Date(ci)) / 86400000);
}

function daysFrom(iso) {
  return Math.round((new Date(iso + 'T00:00:00') - today) / 86400000);
}

function status(b) {
  const ci = new Date(b.ci + 'T00:00:00');
  const co = new Date(b.co + 'T00:00:00');
  if (today >= ci && today < co) return 'current';
  if (ci > today) return 'upcoming';
  return 'past';
}

// ─── BACK-TO-BACK LOGIC ───────────────────────────────────────────────────────
// sameDay: checkout and checkin on same date
// nextDay: checkout on day X, checkin on day X+1
// coMap:   checkout date → booking (to look up leaving group size)
function buildB2B() {
  const coMap = {}, ciSet = new Set();
  bookings.forEach(b => { coMap[b.co] = b; ciSet.add(b.ci); });
  const sameDay = new Set(), nextDay = new Set();
  Object.keys(coMap).forEach(co => {
    if (ciSet.has(co)) sameDay.add(co);
    const next = addDays(co, 1);
    if (ciSet.has(next)) { nextDay.add(co); nextDay.add(next); }
  });
  return { sameDay, nextDay, coMap };
}
const b2b = buildB2B();

// ─── HELPER ASSIGNMENT ────────────────────────────────────────────────────────
// Anusha: Sun(0) Mon(1) Thu(4) Sat(6)
// Afiza:  Tue(2) Wed(3) Fri(5)
// Same-day b2b → helper based on that day, always confirmed
// Next-day b2b → helper based on DEPARTURE day, shown as question if leaving pax > 4
function helperForDay(iso) {
  const dow = new Date(iso + 'T00:00:00').getDay();
  return [0, 1, 4, 6].includes(dow) ? 'Anusha' : 'Afiza';
}

function getHelper(b) {
  if (b2b.sameDay.has(b.ci)) {
    return { name: helperForDay(b.ci), confirmed: true };
  }
  if (b2b.nextDay.has(b.ci)) {
    const prevDay = addDays(b.ci, -1);
    const leaving = b2b.coMap[prevDay];
    if (leaving) {
      const pax = leaving.adults + (leaving.children || 0) + (leaving.infants || 0);
      if (pax > 4) return { name: helperForDay(prevDay), confirmed: false };
    }
  }
  return null;
}

// ─── DATE FORMATTING ──────────────────────────────────────────────────────────
// Same-day b2b dates: bright red. Everything else: black.
function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  const str = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  return b2b.sameDay.has(iso)
    ? '<span style="color:#ff0000;font-weight:700">' + str + '</span>'
    : str;
}

// ─── CARD RENDERER ────────────────────────────────────────────────────────────
function renderCard(b) {
  const s  = status(b);
  const n  = nights(b.ci, b.co);
  const pax = b.adults + (b.children || 0) + (b.infants || 0);

  // Countdown / progress bar
  let countdown = '';
  if (s === 'current') {
    const stayed = nights(b.ci, new Date().toISOString().slice(0, 10));
    const pct = Math.min(100, Math.round(stayed / n * 100));
    const dl = daysFrom(b.co);
    countdown = '<div class="progress"><div class="progress-fill" style="width:' + pct + '%"></div></div>'
              + '<div class="countdown">Checking out in ' + dl + ' day' + (dl !== 1 ? 's' : '') + '</div>';
  } else if (s === 'upcoming') {
    const du = daysFrom(b.ci);
    countdown = '<div class="countdown">Check-in in ' + du + ' day' + (du !== 1 ? 's' : '') + '</div>';
  }

  // Guest chips
  let chips = '';
  if (b.adults)   chips += '<span class="chip">👤 ' + b.adults   + ' adult'    + (b.adults   !== 1 ? 's' : '') + '</span>';
  if (b.children) chips += '<span class="chip">🧒 ' + b.children + ' child'    + (b.children !== 1 ? 'ren' : '') + '</span>';
  if (b.infants)  chips += '<span class="chip">🍼 ' + b.infants  + ' infant'   + (b.infants  !== 1 ? 's' : '') + '</span>';

  // Info rows
  let info = '';

  if (b.phone) {
    info += '<div style="margin-top:6px;display:flex;align-items:center;gap:5px;font-size:0.78rem;color:var(--ocean);font-weight:500;">'
          + '📞 <a href="tel:' + b.phone + '" style="color:var(--ocean);text-decoration:none;">' + b.phone + '</a>'
          + (b.country ? '<span style="color:var(--muted);font-weight:400;">' + b.country + '</span>' : '')
          + '</div>';
  }

  if (b.cot === 'yes') info += '<div class="tag" style="background:var(--pink-bg);color:var(--pink);font-weight:600;">🍼 ' + (b.cotNote || 'Cot + sheets needed') + '</div>';
  if (b.cot === 'ask') info += '<div class="tag" style="background:var(--pink-bg);color:var(--pink);">🍼 Does client need cot?</div>';

  if (b.checkin) info += '<div class="tag" style="background:var(--amber-bg);color:var(--amber);">🕐 ' + b.checkin + '</div>';

  if (b.notes) info += '<div style="margin-top:5px;font-size:0.78rem;color:var(--muted);font-style:italic;">📝 ' + b.notes + '</div>';

  if (b.helperOverride) info += '<div class="tag" style="background:var(--green-bg);color:var(--green);">👥 ' + b.helperOverride + '</div>';

  const helper = getHelper(b);
  if (helper && helper.confirmed && helper.name === 'Anusha') info += '<div class="tag" style="background:var(--green-bg);color:var(--green);">👥 Anusha coming to help Usha</div>';
  if (helper && helper.confirmed && helper.name === 'Afiza')  info += '<div class="tag" style="background:var(--blue-bg);color:var(--blue);">👥 Afiza coming to help Usha</div>';
  if (helper && !helper.confirmed && helper.name === 'Anusha') info += '<div class="tag" style="background:var(--grey-bg);color:var(--grey-green);">👥 Does Anusha need to help Usha?</div>';
  if (helper && !helper.confirmed && helper.name === 'Afiza')  info += '<div class="tag" style="background:#e8f4fd;color:var(--grey-blue);">👥 Does Afiza need to help Usha?</div>';

  return '<div class="card ' + s + '">'
    + '<div class="bar ' + s + '"></div>'
    + '<div class="card-body">'
    + '<div class="card-top">'
    + '<div><div class="gname">' + b.name + '</div>' + countdown + '</div>'
    + '<span class="sbadge ' + s + '">' + (s === 'current' ? 'In house' : s === 'upcoming' ? 'Upcoming' : 'Past') + '</span>'
    + '</div>'
    + '<div class="dates">'
    + '<div class="dblock"><div class="dlabel">Check-in</div><div class="dval">' + fmtDate(b.ci) + '</div></div>'
    + '<div class="nsep"><span class="nnum">' + n + '</span>nights</div>'
    + '<div class="dblock"><div class="dlabel">Check-out</div><div class="dval">' + fmtDate(b.co) + '</div></div>'
    + '</div>'
    + '<div class="chips">' + chips + '</div>'
    + info
    + '</div></div>';
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
let currentFilter = 'all';

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.ftab').forEach(t => t.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function render() {
  const sorted = [...bookings].sort((a, b) => a.ci.localeCompare(b.ci));
  const groups = { current: [], upcoming: [], past: [] };
  sorted.forEach(b => groups[status(b)].push(b));

  function section(label, items) {
    if (!items.length) return '';
    return '<div class="section-label">' + label + '</div><div class="cards">'
      + items.map(renderCard).join('')
      + '</div>';
  }

  let html = '';
  if (currentFilter === 'all') {
    html += section('Currently In House', groups.current);
    html += section('Upcoming', groups.upcoming);
    html += section('Past Stays', groups.past);
  } else {
    const items = groups[currentFilter] || [];
    const label = currentFilter === 'current' ? 'Currently In House' : currentFilter === 'upcoming' ? 'Upcoming' : 'Past Stays';
    html = items.length ? section(label, items) : '<div class="empty">No bookings to show.</div>';
  }

  document.getElementById('list').innerHTML = html;
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.getElementById('todayLabel').textContent =
  today.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
render();
</script>
</body>
